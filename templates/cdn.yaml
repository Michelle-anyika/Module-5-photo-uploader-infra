AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Photo Uploader - CloudFront distribution serving images from the private S3
  photos bucket via Origin Access Control (OAC). The bucket policy grants
  access only to this specific distribution.

Parameters:
  ProjectName:
    Type: String
    Default: photo-uploader
  Environment:
    Type: String
    Default: prod

Resources:
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-${Environment}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName}-${Environment}-photos-cdn"
        PriceClass: PriceClass_200
        DefaultCacheBehavior:
          TargetOriginId: photos-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS managed: CachingOptimized
        Origins:
          - Id: photos-s3-origin
            DomainName:
              Fn::ImportValue: !Sub "${ProjectName}-${Environment}-PhotosBucketRegionalDomainName"
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""

  PhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-PhotosBucketName"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource:
              Fn::Sub:
                - "${BucketArn}/*"
                - BucketArn:
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-PhotosBucketArn"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  DistributionId:
    Value: !Ref Distribution
    Export:
      Name: !Sub "${ProjectName}-${Environment}-CloudFrontDistributionId"
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
    Export:
      Name: !Sub "${ProjectName}-${Environment}-CloudFrontDomainName"
