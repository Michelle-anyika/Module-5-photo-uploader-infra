AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Photo Uploader - ECR repository holding the application container image.

Parameters:
  ProjectName:
    Type: String
    Default: photo-uploader
  Environment:
    Type: String
    Default: prod

Resources:
  AppRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-${Environment}"
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 7 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  RepositoryName:
    Value: !Ref AppRepository
    Export:
      Name: !Sub "${ProjectName}-${Environment}-EcrRepositoryName"
  RepositoryArn:
    Value: !GetAtt AppRepository.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-EcrRepositoryArn"
  RepositoryUri:
    Value: !GetAtt AppRepository.RepositoryUri
    Export:
      Name: !Sub "${ProjectName}-${Environment}-EcrRepositoryUri"
